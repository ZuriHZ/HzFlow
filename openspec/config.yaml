# openspec/config.yaml
schema: spec-driven

context: |
  Product: ZuriHZ (package: zuri) — desktop Electron practice app
  Tech stack: Electron 33 + React 19 + Vite 6 + TypeScript + Tailwind CSS 4 + react-router-dom 7 (HashRouter)
  Main process: electron/main.js (single frameless BrowserWindow, contextIsolation, sandbox, preload)
  Preload: electron/preload.js (electronAPI: theme + window controls; isElectron flag)
  Renderer: src/ (Vite root), alias @ → src; pages: home, config, noticias, blog, features, musica, extras
  UI: TitleBar + Sidebar + Footer; MagicUI/shadcn-style components; framer-motion/motion; Tabler/Lucide icons
  Build: vite build → dist/; electron-builder → release/ (NSIS/DMG/AppImage); appId placeholder com.tuempresa.tuapp
  Testing: none configured | Lint: standard (devDep) | Package managers: npm lock + pnpm lock present
  Auth: none | Backend/GitHub integration: none yet
  Conventions: mixed JSX/TSX; no feature folders yet; routes defined inline in App.jsx (src/routes/routes.tsx empty)

# ──────────────────────────────────────────────
# Change Size Classification
# ──────────────────────────────────────────────
#
# Clasifica los cambios en 3 tamaños. Determina
# qué artefactos de OpenSpec crear.
#
# Evaluá estas dimensiones:
#   1. Archivos afectados (archivos nuevos o modificados)
#   2. Complejidad técnica (IPC, seguridad, DB, etc.)
#   3. Tiempo estimado de implementación
#   4. Riesgo (romper funcionalidad existente)

change_size:
  # ── Cambio pequeño ──
  # 1-3 archivos, ~1-2 horas, bajo riesgo
  # Solo crear tasks.md
  small:
    max_files: 3
    max_hours: 2
    criteria:
      - Single component or hook change
      - CSS/style-only changes
      - Bug fix in isolated file
      - Config change (package.json, vite.config, etc.)
      - Documentation update
    artifacts:
      - tasks.md
    skip:
      - proposal.md
      - design.md
      - specs/
    example: "Add error boundary to TitleBar", "Fix color in UpdateReady"

  # ── Cambio mediano ──
  # 4-8 archivos, ~4-8 horas, riesgo medio
  # Crear proposal.md + tasks.md
  medium:
    max_files: 8
    max_hours: 8
    criteria:
      - New feature (single module)
      - IPC channel addition
      - Component refactor across 2-3 files
      - UI flow with multiple states
      - Integration with external API
    artifacts:
      - proposal.md
      - tasks.md
    skip:
      - design.md
      - specs/
    example: "Add GitHub PR management", "New notification system"

  # ── Cambio grande ──
  # 9+ archivos, multi-día, alto riesgo
  # Crear proposal.md + design.md + specs/ + tasks.md
  large:
    min_files: 9
    min_hours: 8
    criteria:
      - Multi-module feature (main + preload + renderer)
      - Architecture change
      - Security-sensitive changes (auth, IPC, nodeIntegration)
      - Database schema changes
      - New build/deployment pipeline
      - Changes touching 3+ layers (main/preload/renderer)
    artifacts:
      - proposal.md
      - design.md
      - specs/
      - tasks.md
    example: "Auto-update system via R2", "Multi-window architecture"

  # ── Cómo determinar el tamaño ──
  # Regla rápida:
  #   - ¿Toca solo 1-2 archivos? → small
  #   - ¿Toca 3-5 archivos o es un feature nuevo? → medium
  #   - ¿Toca 6+ archivos o toca main+preload+renderer? → large
  #
  # Para features que cruzan capas (main ↔ preload ↔ renderer),
  # SIEMPRE serán al menos medium, probablemente large.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules (electron main/preload vs renderer src/)
    - Call out security implications for any IPC or nodeIntegration changes
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for IPC and multi-window flows
    - Document architecture decisions with rationale
    - Prefer contextIsolation + sandbox; never enable nodeIntegration in renderer
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills: react-19, typescript, tailwind-4, zod-4
    tdd: false
    test_command: ""
  verify:
    - Compare implementation against every spec scenario
    - Smoke-check dev (npm run dev) and build (npm run build) when touching shell or bundling
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
